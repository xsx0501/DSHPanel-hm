name: release-hap

# Tagging `v*` builds an UNSIGNED HAP, the same way an Android project builds an
# APK on a tag. Signing stays local: the .p7b profile is bound to one Huawei
# developer account, bundleName and device whitelist, so CI cannot mint one.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # HarmonyOS command line tools: hvigorw + the SDK. Fill `version` with the
      # CLI tools release that ships your compileSdkVersion (API 26 here); leave it
      # empty to take the latest published one.
      - name: Setup HarmonyOS CLI tools
        uses: ErBWs/setup-ohos@v2
        with:
          version: ''
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev

      - name: Build unsigned HAP
        working-directory: client
        env:
          DEVECO_SDK_HOME: ${{ env.HOS_SDK_HOME }}
        run: |
          hvigorw --version
          hvigorw --mode module \
            -p product=default \
            -p module=panel@default \
            -p buildMode=release \
            assembleHap --no-daemon
          ls -l panel/build/default/outputs/default/

      - name: Name the artefact
        id: collect
        run: |
          set -euo pipefail
          src="$(ls client/panel/build/default/outputs/default/*.hap | head -1)"
          case "$GITHUB_REF_NAME" in
            v*) out="DSHPanel-${GITHUB_REF_NAME}-unsigned.hap" ;;
            *)  out="DSHPanel-unsigned.hap" ;;
          esac
          cp "$src" "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          ls -l "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: dshpanel-hap
          path: ${{ steps.collect.outputs.file }}
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.collect.outputs.file }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            **未签名 HAP**，由 tag `${{ github.ref_name }}` 构建（`${{ github.sha }}`）。

            安装前需要本地签名：用 DevEco Studio 的 *Build > Generate Key and CSR* /
            *Project Structure > Signing Configs* 配好签名后，直接对源码签名构建，
            或对这里下载的 HAP 用 `hap-sign-tool` 重签。
